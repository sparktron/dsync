name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installs the ruff version pinned in pyproject.toml [dev], so a new ruff
      # release cannot turn the build red without a deliberate bump.
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check dsync/ tests/
      - name: ruff format
        run: python -m ruff format --check dsync/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Verify CLI entry point
        run: dsync --help
      - name: Run tests
        run: python -m pytest -q

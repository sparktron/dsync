[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsync"
version = "0.1.0"
description = "SSH deploy tool for dylansparks.com"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "paramiko>=3.4",
    "rich>=13.7",
    "watchdog>=4.0",
]

[project.scripts]
dsync = "dsync.cli:cli"

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsync*"]

[tool.ruff]
target-version = "py39"

# Ruff's *default* rule set is not stable across releases -- 0.16 widened it and
# turned CI red on unchanged code. Select explicitly so a future ruff release
# can only change this build when someone edits this block on purpose.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: the subset ruff has always defaulted to
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "DTZ",             # timezone-naive datetimes
    "PLW",             # pylint warnings
    "RUF",             # ruff-specific
]
ignore = [
    "UP045",   # Optional[X] -> X | None: cosmetic only; package still targets 3.9
    "PLW0603", # module-level passphrase/agent cache is deliberate, not accidental
    "RUF001",  # the "info" glyph in console output is intentional, not a typo
]
